# pyproject.toml - Python's own file for claude-code-mind-viz.
#
# It pins the toolchain. `recipe.ps1 test` runs pytest, mypy, ruff check and ruff
# format, and every setting those four read is here. There are no task-runner
# sections: the recipe's verbs are the tasks.

[build-system]
# Pinned with a version, not a bare name: an unpinned backend changes what
# `recipe.ps1 build` produces without anyone editing this file.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-mind-viz"
# This must equal $Version in recipe.ps1: `recipe.ps1 test` fails when they disagree.
version = "1.0.0"
description = "Console tool that reads a Mermaid decision graph and prints its counts, open questions, rejected hypotheses and longest chain."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
# The standard library only.
dependencies = []

[dependency-groups]
# `uv run` installs this group by default, so test.yaml's Runner health step finds
# ruff, pytest and mypy through `uv run --frozen <tool> --version`.
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "coverage==7.15.2",
]

[tool.setuptools]
# One module, not a package. It has no console script on purpose: `python -m mmdstats`
# runs its __main__ block, which sets stdout to UTF-8 for the Russian report.
package-dir = { "" = "src" }
py-modules = ["mmdstats"]

[tool.uv]
# The tests and `recipe.ps1 run` use the source tree, so uv does not install the project.
package = false

[tool.ruff]
# Ruff refuses to run at all when its own version is not this one.
required-version = "0.16.1"
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
# Section 7 prints these files verbatim, so the formatter must not touch them.
exclude = [".claude/**", "tests/manual/serve.py", "tools/wiki.py"]

[tool.pytest.ini_options]
# test_mmdstats.py stays at the root, where it reads .claude/decision_graph beside it.
testpaths = ["tests", "test_mmdstats.py"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = "-q --cov=src --cov-report=term --cov-fail-under=97"

[tool.coverage.run]
source = ["src"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tools"]
mypy_path = "src"
explicit_package_bases = true
